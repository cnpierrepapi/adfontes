# Re-checks AD FONTES against NEAR testnet on a timer: scripts/verify.mjs reads the chain itself
# (view calls only, no keys, no npm install) and fails if anything the site claims doesn't match.
# Runs every 2 hours, 8 minutes after each live turn is sealed (turns land at about :32 past even
# hours, UTC), on every push, and by hand.
name: verify against NEAR
on:
  schedule:
    - cron: "40 */2 * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the live world against NEAR
        run: node scripts/verify.mjs
