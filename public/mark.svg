  <g stroke="#0b6f96" stroke-linecap="round" fill="none">
    <path d="M32 33 C32 18 32 12 32 8" stroke-width="7.4"/>
    <path d="M32 33 C30 22 22 16 15 20" stroke-width="6.4"/>
    <path d="M32 33 C34 22 42 16 49 22" stroke-width="6.4"/>
  </g>
  <circle cx="13" cy="25" r="3.4" fill="#0b6f96"/>
  <circle cx="51" cy="27" r="3.4" fill="#0b6f96"/>
  <path d="M32 33 C32 18 32 12 32 8" stroke="#2fd6f0" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M32 33 C30 22 22 16 15 20" stroke="#4ff0ff" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M32 33 C34 22 42 16 49 22" stroke="#4ff0ff" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M32 31 C32 20 32 14 32 10" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".9"/>
  <circle cx="13" cy="25" r="2.2" fill="#4ff0ff"/>
  <circle cx="51" cy="27" r="2.2" fill="#4ff0ff"/>
  <!-- island top (grass), faceted -->
  <polygon points="8,34 20,30 32,31 32,38 10,38" fill="#9ff7b8"/>
  <polygon points="32,31 44,30 56,34 54,38 32,38" fill="#4fd98a"/>
  <!-- island rock, an inverted faceted cone -->
  <polygon points="10,38 32,38 28,49 " fill="#ffb37a"/>
  <polygon points="28,49 32,38 37,50 32,61" fill="#ff8f5a"/>
  <polygon points="32,38 54,38 37,50" fill="#e8703f"/>
  <polygon points="10,38 28,49 32,61" fill="#ff9f6a"/>
  <polygon points="37,50 54,38 32,61" fill="#d65f32"/>
