<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>AD FONTES: play</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AD FONTES" />
    <meta property="og:url" content="https://adfontes.fun/play/" />
    <meta property="og:title" content="AD FONTES: play" />
    <meta property="og:description" content="Found a nation next to three AI nations taken from the live world as they stand right now. Seven turns. Your god's reverence gained is your score." />
    <meta property="og:image" content="https://adfontes.fun/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="description" content="Found a nation next to three AI nations taken from the live world as they stand right now. Seven turns. Your god's reverence gained is your score." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1d1430" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/live/live.css" />
    <link rel="stylesheet" href="/src/season/season.css" />
    <link rel="stylesheet" href="/src/sandbox/sandbox.css" />
    <link rel="stylesheet" href="/src/game/game.css" />
  </head>
  <body class="live season sandbox night play">
    <canvas id="world"></canvas>
    <div id="plates" class="plates"></div>
    <div id="visor" class="visor">
      <header class="hud-top">
        <a class="brand" href="/"><img src="/favicon.svg" alt="" width="34" height="34" /><span>AD FONTES</span></a>
        <div class="dial sim" id="dial">play</div>
        <nav><button id="home" class="chip" type="button">◎ <span class="word">Whole world</span></button> <a class="chip" href="/">Live world</a> <button id="out" class="chip" type="button" hidden>Log out</button></nav>
      </header>
      <aside id="panel" class="godpanel gm-report" hidden></aside>
      <div class="ss-bar sb-bar gm-bar" id="bar" hidden>
        <span class="ss-turn sim" id="turn">Turn 1 of 7</span>
        <span class="gm-stat" id="stat"></span>
        <span class="sb-run" id="run"></span>
        <button id="report" class="sb-reset" type="button" hidden>Turn report</button>
        <button id="end" class="tl-go gm-end" type="button">End turn</button>
      </div>
      <div class="ss-start gm-card" id="card">
        <small>Play</small>
        <b>Your nation against three from the live world</b>
        <p id="card-p">Loading…</p>
        <div id="card-body"></div>
        <p class="sb-err" id="card-err" hidden></p>
      </div>
    </div>
    <script type="module" src="/src/game/main.js"></script>
  </body>
</html>
