  </head>
  <body class="live season sandbox night">
    <canvas id="world"></canvas>
    <div id="plates" class="plates"></div>
    <div id="visor" class="visor">
      <header class="hud-top">
        <a class="brand" href="/"><img src="/favicon.svg" alt="" width="34" height="34" /><span>AD FONTES</span></a>
        <div class="dial sim" id="dial">sandbox</div>
        <nav><button id="all" class="chip" type="button">▦ <span class="word">All nations</span></button> <button id="home" class="chip" type="button">◎ <span class="word">Whole world</span></button> <a class="chip" href="/">Live world</a> <a class="chip" href="/judge/">For judges</a></nav>
      </header>
      <aside id="panel" class="godpanel" hidden></aside>
      <aside id="lab" class="sb-lab" hidden></aside>
      <p class="ss-cap" id="cap"></p>
      <div class="ss-bar sb-bar" id="bar">
        <span class="ss-turn sim" id="turn">Copy</span>
        <span class="sb-run" id="run"></span>
        <span class="sb-ff"><button type="button" data-n="1" title="One turn: two hours of world time">+1 turn</button><button type="button" data-n="12" title="Twelve turns: one day of world time">+1 day</button><button type="button" data-n="84" title="84 turns: a week of world time">+1 week</button></span>
        <button id="reset" class="sb-reset" type="button" title="Throw this copy away and take a fresh one of the live world">↺ <span class="word">Fresh copy</span></button>
      </div>
      <div class="ss-all" id="allbox" hidden></div>
      <div class="ss-start" id="start">
        <small>The sandbox</small>
        <b>Shock the world. Watch it recover, or not.</b>
        <p id="start-p">Loading…</p>
        <button id="go" class="tl-go" type="button">Open my copy</button>
        <p class="sb-err" id="start-err" hidden></p>
      </div>
    </div>
    <script type="module" src="/src/sandbox/main.js"></script>
  </body>
</html>
